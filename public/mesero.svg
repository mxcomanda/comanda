<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-label="Mesero vintage de Comanda con charola">
  <!-- Mesero estilo caricatura vintage años 30, tinta negra sobre blanco.
       Recreación original en SVG para Vercel: NO es la imagen generada en Muse
       (assets/mesero.webp, que vive dentro del artefacto y no se puede exportar
       tal cual). El ojo izquierdo quedó corregido aquí: ambos ojos simétricos,
       sin guiño raro. -->
  <g fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- charola con campana -->
    <path d="M40 96 H280" />
    <path d="M150 96 a30 30 0 0 1 60 0" fill="#fff" />
    <circle cx="180" cy="62" r="4" fill="#111" stroke="none" />
    <path d="M150 96 h60" />
    <!-- brazo levantado -->
    <path d="M235 250 C 260 200, 275 160, 270 100" />
    <path d="M225 250 C 245 210, 258 170, 258 100" />
    <!-- cabeza -->
    <circle cx="160" cy="170" r="52" fill="#fff" />
    <!-- bigote -->
    <path d="M132 196 Q146 188 160 196 Q174 188 188 196" fill="#111" stroke="none" />
    <!-- ojos simétricos -->
    <circle cx="140" cy="168" r="7" fill="#111" stroke="none" />
    <circle cx="180" cy="168" r="7" fill="#111" stroke="none" />
    <circle cx="142" cy="166" r="2" fill="#fff" stroke="none" />
    <circle cx="182" cy="166" r="2" fill="#fff" stroke="none" />
    <!-- sonrisa -->
    <path d="M142 212 Q160 224 178 212" />
    <!-- cuerpo / uniforme -->
    <path d="M160 222 L160 250" />
    <path d="M95 400 C95 300 120 260 160 250 C200 260 225 300 225 400 Z" fill="#fff" />
    <!-- moño -->
    <path d="M146 252 L160 262 L174 252 L160 244 Z" fill="#d61f26" stroke="#111" />
    <!-- botones -->
    <circle cx="160" cy="300" r="4" fill="#111" stroke="none" />
    <circle cx="160" cy="330" r="4" fill="#111" stroke="none" />
    <circle cx="160" cy="360" r="4" fill="#111" stroke="none" />
    <!-- brazo con toalla -->
    <path d="M100 300 C80 330 78 360 90 385" />
  </g>
  <g fill="#d61f26">
    <path d="M30 60 l10 4 -10 4 4 -10z" />
    <path d="M295 130 l10 4 -10 4 4 -10z" />
    <path d="M52 210 l8 3 -8 3 3 -8z" />
  </g>
</svg>
